<style>
/* ===== 绿白矩形加载动画（新增，不改动上方原有样式） ===== */
body{background:#ffffff;margin:0;overflow:hidden;}
#loaderMask{position:fixed;inset:0;background:#ffffff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:9999;transition:opacity .6s ease;}
.rectBox{width:180px;}
.rectTrack{width:100%;height:16px;background:#eef7f6;border-radius:8px;overflow:hidden;
  box-shadow:inset 0 0 0 1px #d9efec;}
.rectFill{width:0%;height:100%;border-radius:8px;
  background:linear-gradient(90deg,#ffffff 0%,#6fe3d6 45%,#10beae 100%);
  animation:rectFlow 2.4s cubic-bezier(.4,0,.2,1) infinite;}
@keyframes rectFlow{
  0%{width:0%;opacity:.85;}
  60%{opacity:1;}
  100%{width:100%;opacity:.9;}
}
.rectCap{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#10beae;}
.rectPct{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.5px;
  min-width:58px;text-align:right;}
.rectLab{font-size:13px;color:#8fc9c2;letter-spacing:2px;}
.rectSub{margin-top:8px;font-size:11px;color:#b8d9d4;letter-spacing:3px;
  font-family:-apple-system,"PingFang SC",sans-serif;}
</style>

<body>

<div class="container" id="container">
            <div class="dot dot-1"></div>
            <div class="dot dot-2"></div>
            <div class="dot dot-3"></div>
</div>

<!-- 绿白矩形加载动画（居中·背景留白·简约美观） -->
<div id="loaderMask">
  <div class="rectBox">
    <div class="rectTrack"><div class="rectFill" id="rectFill"></div></div>
    <div class="rectCap"><span class="rectPct" id="rectPct">0%</span><span class="rectLab">LOADING</span></div>
    <div class="rectSub">加 载 中</div>
  </div>
</div>

 <script>

 <script>
var firefox = navigator.userAgent.indexOf('Firefox') != -1;
function MouseWheel(e,doc){
	e.preventDefault && e.preventDefault(),e.returnValue = false;
	var up = firefox && e.detail < 0 || e.wheelDelta > 0;
	doc.body.scrollTop = doc.documentElement.scrollTop += up?-50:50;
}
function bindMouseWhee(ifr){
	try{
		var doc = ifr.contentWindow.document;
		firefox?doc.addEventListener('DOMMouseScroll',function(e){MouseWheel(e,doc)},false):(doc.onmousewheel = function(e){MouseWheel(e||ifr.contentWindow.event,doc)});
	}catch(e){
		alert('跨域无法获取iframe加载document'+e);
	}
}
</script>
<script>
/* 矩形进度百分比驱动（独立脚本，不修改上方原有两段脚本） */
(function(){
  var fill=document.getElementById('rectFill'),pct=document.getElementById('rectPct'),mask=document.getElementById('loaderMask');
  var start=performance.now(),dur=2400;
  function tick(t){
    var p=((t-start)%dur)/dur;
    var val=Math.min(100,Math.round(p*100));
    if(pct)pct.textContent=val+'%';
    if(fill)fill.style.width=val+'%';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  /* container 隐藏或超时后淡出遮罩 */
  var obs=new MutationObserver(function(){if(window.getComputedStyle(document.getElementById('container')).display==='none')fade();});
  obs.observe(document.getElementById('container'),{attributes:true,attributeFilter:['style']});
  setTimeout(fade,6500);
  function fade(){if(!mask||mask.dataset.gone)return;mask.dataset.gone=1;mask.style.opacity=0;setTimeout(function(){mask.style.display='none';},650);}
})();
</script>
